# Eddington 1919 palette: the single source of truth for flat-colour materials.
# Used by Blender builds (art/pipeline/blender/kit.py) and shown as chips in the
# lookdev scene (scripts/lookdev.gd). Hex is sRGB albedo.
#
# Value rule (BIBLE §4): albedo HSV value stays within 0.08–0.82. Anything
# brighter is reserved for EVIDENCE (Sun/corona, stars, glass plates, the
# measuring sheet), so the player's eye always lands on the evidence first.
# Saturation rule: ≤ 0.65; the only saturated hues are laterite red and brass.
#
# role: ground | foliage | structure | instrument | accent | far | evidence

[swatch.laterite]
hex = "#9A5637"  # was #9A4E2F (S 0.70 > cap, review fix)
role = "ground"
roughness = 0.95

[swatch.laterite_wet]
hex = "#6E3B29"  # was #6E3826 (S 0.66 > cap)
role = "ground"
roughness = 0.55

