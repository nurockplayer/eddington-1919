# Asset Factory pilot af01: 20 candidate environment assets for the Príncipe
# 1919 camp at Roça Sundy. Same contract as art/assets.toml (validate.py reads
# this file with --registry), plus the factory fields:
#
#   route        blender_procedural | meshy | tripo | mpfb   (why: `route_why`)
#   licence      what the output may be used under (art/factory/LICENCES.md)
#   est_credits  paid-generator credits for one attempt (0 for local routes)
#   qa           in-game QA placement: [x, z] metres in the Godot world, yaw°
#   status       planned → built (raw) → ingested → g2 → g3 → g4 → candidate
#                → accepted (Owner/Director only; promotion copies the entry
#                into art/assets.toml and the GLB into assets/models/)
#
# Candidate GLBs live in assets/candidates/af01/ (excluded from exports) and
# never overwrite assets/models/. dims_m = [width X, depth Y, height Z],
# Blender Z-up, front faces -Y (Godot +Z), origin bottom-centre (BIBLE §6).
#
# Routing rule (BIBLE §3): mechanical, dimensioned, joinery and repeated kit
# props → Blender procedural (exact dims, palette materials, $0, deterministic).
# Organic or irregular forms (cloth, sacks, rock, split wood, wicker) → image→3D
# (Meshy MCP/REST or Tripo), concept image first, then ingest to spec.

[batch]
id = "af01"
theme = "Príncipe 1919: expedition camp and cocoa-roça set dressing"
budget_credits = 200          # Meshy credits; hard cap enforced by factory.py
budget_usd_cap = 10.0         # Owner-facing ceiling; the account's real credit price must be confirmed
approval_file = "art/factory/af01/APPROVAL.toml"   # absent → paid routes refuse to run
candidates_dir = "assets/candidates/af01"
# Wide in-game views (player feet position, look target, lighting state), each
# rendered with and without the candidates by tests/factory_qa.gd.
qa_views = [
  { name = "camp_day", eye = [7.5, 0.05, 5.0], target = [2.0, 0.8, -1.0], light = "prep_early" },
  { name = "roca_west", eye = [-1.5, 0.05, 9.0], target = [-9.0, 1.4, 2.0], light = "prep_early" },
  { name = "camp_totality", eye = [7.5, 0.05, 5.0], target = [2.0, 0.8, -1.0], light = "totality" },
  { name = "darkroom_night", eye = [9.2, 0.05, 4.2], target = [11.0, 0.5, 1.9], light = "night" },
]

