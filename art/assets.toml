# Asset registry: one entry per production asset. This is the contract that
# art/pipeline/blender/validate.py (gate G2) checks every exported GLB against.
# Budgets follow art/BIBLE.md §6. dims_m = [width X, depth Y, height Z] in Blender
# metres (Z-up). In Godot that is [X, Z, Y]; the asset's front faces +Y in
# Blender, which is +Z in Godot.
#
# status: concept → modelled → validated (G2) → in-game (G4) → accepted (G5)

[asset.coelostat]
category = "hero_prop"
source = "blender_procedural"   # tripo when TRIPO_API_KEY is available (art/PIPELINE.md S3a)
build = "art/pipeline/blender/build_coelostat.py"
export = "assets/models/coelostat.glb"
concept = "art/runs/r03-assets/coelostat-E-gpt-1.jpg"
dims_m = [1.30, 1.00, 1.72]
dims_tolerance = 0.15
bounds_centre_offset_m = [0.18, 0.0]  # origin = pier centre; the drive box overhangs on +X
pivots = { coelostat_mirror = [0.0, 0.0, 1.40] }  # mirror tilt axis
tri_budget = 6000
max_materials = 6               # brick, stone, iron, brass, mirror, teak_dark
max_texture_px = 1024
history = "RECONSTRUCTION: ~40 cm (16 in) mirror per secondary sources; clock-driven by a falling weight; pier form invented."
status = "in-game"

[asset.packing_crate]
category = "kit_prop"            # reused many times; must instance cleanly
source = "blender_procedural"
build = "art/pipeline/blender/build_packing_crate.py"
export = "assets/models/packing_crate.glb"
concept = "art/runs/r03-assets/packing_crate-E-gpt-2.jpg"
dims_m = [0.70, 0.50, 0.50]
dims_tolerance = 0.10
tri_budget = 600
max_materials = 3               # pine, teak_dark battens, iron straps
max_texture_px = 512
history = "RECONSTRUCTION: generic period wooden packing case; stencil text is added in-engine (Label3D) so it stays editable."
status = "in-game"

# r04 foliage kit: replaces the 70 default SphereMesh shrubs (G4 attribution run
# art/validation/g4-r04-noshrubs: they were 55–81% of all primitives per bookmark).
# Drawn with MultiMeshInstance3D in world_builder.gd, scaled 0.8–1.8 per instance,
# so the budget is per instance and deliberately far below kit_prop's 600.
[asset.shrub_cocoa]
category = "kit_prop"
source = "blender_procedural"   # tripo when TRIPO_API_KEY is available (organic, BIBLE §3)
build = "art/pipeline/blender/build_foliage.py"
export = "assets/models/shrub_cocoa.glb"
concept = "art/runs/r04-shelter-foliage/foliage_kit-E-gpt-1.jpg"
dims_m = [2.0, 2.0, 1.6]
dims_tolerance = 0.15
tri_budget = 300
max_materials = 3               # foliage_deep, foliage_light, teak_dark (trunk)
max_texture_px = 0
history = "RECONSTRUCTION: generic young cocoa / undergrowth shrub around a Príncipe roça clearing."
status = "in-game"

[asset.banana_clump]
category = "kit_prop"
source = "blender_procedural"
build = "art/pipeline/blender/build_foliage.py"
export = "assets/models/banana_clump.glb"
concept = "art/runs/r04-shelter-foliage/foliage_kit-E-gpt-1.jpg"
dims_m = [2.6, 2.6, 2.6]   # r04: v2 leaves arch outward; measured 2.76 × 2.44 × 2.48
dims_tolerance = 0.15
tri_budget = 300
max_materials = 2               # foliage_deep, foliage_light
max_texture_px = 0
history = "RECONSTRUCTION: banana clumps are typical shade plants on São Tomé and Príncipe cocoa roças."
status = "in-game"

# r04 shelter + tube. Layout from scripts/world_builder.gd _shelter_and_instrument:
# both models are placed at (0, 0, -3.75) in Godot (centre of the post rectangle /
# centre of the tube). Colliders and interaction hotspots stay in code (BIBLE §6).
[asset.sun_shelter]
category = "architecture"
source = "blender_procedural"
build = "art/pipeline/blender/build_shelter_tube.py"
export = "assets/models/sun_shelter.glb"
concept = "art/runs/r04-shelter-foliage/sun_shelter-E-gpt-2.jpg"
dims_m = [5.4, 7.0, 3.43]
dims_tolerance = 0.08
# Three objects, all with origin at (0,0,0): sun_shelter (posts, beams; static),
# sun_shelter_roof (canvas + valance; hidden at totality, the game's `roof` node),
# sun_shelter_roll (the rolled-back canvas; shown only while the roof is hidden).
tri_budget = 3000
max_materials = 4               # teak posts, teak_dark beams, canvas, pine rope
max_texture_px = 0
history = "RECONSTRUCTION: no in-situ photograph of the Príncipe station is known (docs/PROVENANCE.md); open timber shelter with a canvas roof rolled back before totality."
status = "in-game"

[asset.horizontal_tube]
category = "hero_prop"
source = "blender_procedural"
build = "art/pipeline/blender/build_shelter_tube.py"
export = "assets/models/horizontal_tube.glb"
concept = "art/runs/r04-shelter-foliage/horizontal_tube-E-gpt-1.jpg"
dims_m = [0.77, 3.81, 1.60]
dims_tolerance = 0.08
tri_budget = 6000
max_materials = 5               # iron tube, brass cell, ebonite object-glass face, teak trestles, teak_dark carrier
max_texture_px = 0
history = "RECONSTRUCTION: horizontal tube fed by the coelostat, with the Oxford astrographic object glass (13 in, stopped to 8 in; HISTORICAL_RECORD, docs/PROVENANCE.md); tube construction, trestles and carrier are invented."
status = "in-game"

# r06 people (MPFB route, art/people/). Rigged + animated ("idle"), CC0 only.
# dims are measured in the posed idle (arms down) with the hat on.
[asset.eddington]
category = "character"
source = "mpfb_procedural"
build = "art/pipeline/blender/build_person.py eddington"
export = "assets/models/eddington.glb"
concept = "art/people/REFERENCE.md"
dims_m = [0.55, 0.35, 1.87]
dims_tolerance = 0.2
bounds_centre_offset_m = [0.0, -0.05]  # toes and hat brim reach forward of the standing axis
tri_budget = 16000
max_materials = 10
max_texture_px = 0
skip_checks = ["object_origins"]  # hat/glasses are parented to the head bone, so their origins sit at the head by design
history = "RECONSTRUCTION: face/hair/glasses from a c.1915 portrait (Lemos 2019 Fig. 4); 1919 dress, hat and height undocumented."
status = "in-game"

