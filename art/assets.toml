# Asset registry: one entry per production asset. This is the contract that
# art/pipeline/blender/validate.py (gate G2) checks every exported GLB against.
# Budgets follow art/BIBLE.md §6. dims_m = [width X, depth Y, height Z] in Blender
# metres (Z-up). In Godot that is [X, Z, Y]; the asset's front faces +Y in
# Blender, which is +Z in Godot.
#
# status: concept → modelled → validated (G2) → in-game (G4) → accepted (G5)

[asset.coelostat]
category = "hero_prop"
source = "blender_procedural"   # tripo when TRIPO_API_KEY is available (art/PIPELINE.md S3a)
build = "art/pipeline/blender/build_coelostat.py"
export = "assets/models/coelostat.glb"
concept = "art/runs/r03-assets/coelostat-E-gpt-1.jpg"
dims_m = [1.30, 1.00, 1.72]
dims_tolerance = 0.15
bounds_centre_offset_m = [0.18, 0.0]  # origin = pier centre; the drive box overhangs on +X
pivots = { coelostat_mirror = [0.0, 0.0, 1.40] }  # mirror tilt axis
tri_budget = 6000
max_materials = 6               # brick, stone, iron, brass, mirror, teak_dark
max_texture_px = 1024
history = "RECONSTRUCTION: ~40 cm (16 in) mirror per secondary sources; clock-driven by a falling weight; pier form invented."
status = "in-game"

[asset.packing_crate]
category = "kit_prop"            # reused many times; must instance cleanly
source = "blender_procedural"
build = "art/pipeline/blender/build_packing_crate.py"
export = "assets/models/packing_crate.glb"
concept = "art/runs/r03-assets/packing_crate-E-gpt-2.jpg"
dims_m = [0.70, 0.50, 0.50]
dims_tolerance = 0.10
tri_budget = 600
max_materials = 3               # pine, teak_dark battens, iron straps
max_texture_px = 512
history = "RECONSTRUCTION: generic period wooden packing case; stencil text is added in-engine (Label3D) so it stays editable."
status = "in-game"
