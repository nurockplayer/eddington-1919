text = """
Arthur Stanley Eddington in 1917, aged 34, Plumian Professor at Cambridge. \
Documented appearance: clean-shaven, a narrow long face, a high forehead, strong dark brows, \
dark hair brushed back with a slight side parting and receding at the temples, \
rimless pince-nez clipped at the nose bridge with no temple arms, a slender build, about 1.78 m tall. \
Reconstruction: a three-piece lounge suit with a buttoned waistcoat, a stiff white turn-down collar, \
a dark narrow tie, polished dark leather shoes, a watch chain across the waistcoat, no hat. \
Posture: upright but a little reserved and shy, shoulders slightly forward, hands relaxed."""

