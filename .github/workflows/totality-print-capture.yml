name: totality-print-capture
on:
  push:
    branches: [art/totality-print]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: head
      - uses: actions/checkout@v5
        with:
          ref: 606bcc4
          path: main
      - name: Install Godot, Xvfb and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1 libasound2t64 ffmpeg
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          zip=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -O "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" -d "$HOME/godot"
          ln -s "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
      - name: Capture both revisions in real windowed Vulkan scenes
        run: |
          set -euo pipefail
          for icd in lvp_icd.x86_64.json lvp_icd.json; do
            if [ -f "/usr/share/vulkan/icd.d/$icd" ]; then export VK_ICD_FILENAMES="/usr/share/vulkan/icd.d/$icd"; break; fi
          done
          mkdir -p main/tools/totality_print
          cp head/tools/totality_print/capture.gd main/tools/totality_print/capture.gd
          for revision in main head; do
            mkdir -p "$GITHUB_WORKSPACE/frames/$revision"
            godot --headless --path "$revision" --import >"frames/$revision/import.log" 2>&1
            motion=""
            if [ "$revision" = head ]; then motion=--motion; fi
            timeout 3000 xvfb-run -a -s '-screen 0 1280x720x24' godot --path "$revision" --windowed --resolution 1280x720 --rendering-method forward_plus --rendering-driver vulkan --audio-driver Dummy --fixed-fps 60 --script res://tools/totality_print/capture.gd -- --seed=7 --out="$GITHUB_WORKSPACE/frames/$revision" $motion >"frames/$revision/render.log" 2>&1
            if grep -E 'SCRIPT ERROR|SHADER ERROR|ERROR:' "frames/$revision/render.log"; then exit 1; fi
          done
          ffmpeg -v error -framerate 60 -i frames/head/motion/f_%03d.png -c:v libx264 -crf 16 -pix_fmt yuv420p frames/head/sweep.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totality-print-frames
          path: frames
