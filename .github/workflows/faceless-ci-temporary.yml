name: faceless-ci-temporary
on:
  push:
    branches: [art/faceless-3d]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          path: head
          persist-credentials: false
      - name: Install renderer
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          zip=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" -d "$HOME/godot"
          ln -s "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libgl1 libasound2t64
      - name: Capture each revision sequentially
        run: |
          set -euo pipefail
          for icd in lvp_icd.x86_64.json lvp_icd.json; do
            if [ -f "/usr/share/vulkan/icd.d/$icd" ]; then
              export VK_ICD_FILENAMES="/usr/share/vulkan/icd.d/$icd"
              break
            fi
          done
          test -n "${VK_ICD_FILENAMES:-}"
          for repo in head; do
            mkdir -p "$repo/tools/faceless_3d" "$GITHUB_WORKSPACE/out/$repo/frames"
            godot --headless --path "$repo" --import > "out/$repo/import.log" 2>&1
            timeout --kill-after=30 3600 xvfb-run -a -s '-screen 0 1280x720x24' godot --path "$repo" --rendering-driver vulkan --audio-driver Dummy --resolution 1280x720 --fixed-fps 60 --script res://tools/faceless_3d/capture.gd -- --out="$GITHUB_WORKSPACE/out/$repo/measurements.json" --capture="$GITHUB_WORKSPACE/out/$repo/frames" > "out/$repo/capture.log" 2>&1
            if grep -nE 'SCRIPT ERROR|SHADER ERROR|Shader compilation failed' "out/$repo/capture.log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faceless-capture-${{ github.run_id }}
          path: out/
          retention-days: 7
