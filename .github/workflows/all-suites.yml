name: all-suites

# Every tests/test_*.gd, one at a time, about 12 minutes on a hosted runner.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.7.2
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          zip=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" -d "$HOME/godot"
          ln -s "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          rm "$zip" SHA512-SUMS.txt
      - name: Run all suites
        run: ./tools/all_suites.sh
